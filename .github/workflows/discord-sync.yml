name: Sync Features to Discord
on:
  push:
    branches:
      - main
    paths:
      - 'features.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Features File
        id: read_md
        run: |
          # Read file content and cleanly format it for GitHub Actions variables
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "FILE_DATA<<$EOF" >> $GITHUB_ENV
          cat features.md >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Post Content to Discord
        uses: sinscary/discord-webhook-action@v1.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          description: ${{ env.FILE_DATA }}
          username: "Features Monitor Bot"
          avatar-url: "https://githubassets.com"
