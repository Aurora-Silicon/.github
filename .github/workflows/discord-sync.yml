name: Sync Features to Discord
on:
  push:
    branches:
      - main
    paths:
      - 'features.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Load Features Content
        id: read_file
        run: |
          # Safely read the multiline markdown file into a workflow environment variable
          {
            echo "FEATURES_TEXT<<EOF"
            cat features.md
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Update Discord Live Message
        uses: JayRizzo/Discord-Webhook-Action@v1.2.2
        with:
          client-id: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message-id: "1535224455218077707"
          content: ${{ env.FEATURES_TEXT }}
