name: Sync Features to Discord
on:
  push:
    branches:
      - main
    paths:
      - 'features.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create or Update Discord Message
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 1. Read features.md and escape it safely into a valid JSON string directly
          JSON_CONTENT=$(jq -R -s '.' features.md)
          
          # Verify the content isn't empty before proceeding
          if [ "$JSON_CONTENT" = '""' ] || [ -z "$JSON_CONTENT" ]; then
            echo "Error: features.md appears to be empty."
            exit 1
          fi

          ID_FILE=".github/discord_msg_id.txt"
          
          # 2. If a tracking file exists, try to update the existing message
          if [ -f "$ID_FILE" ]; then
            MSG_ID=$(cat "$ID_FILE")
            echo "Found existing message ID: $MSG_ID. Attempting update..."
            
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Content-Type: application/json" \
              -d "{\"content\": $JSON_CONTENT}" \
              "$WEBHOOK_URL/messages/$MSG_ID")
              
            if [ "$RESPONSE" = "200" ]; then
              echo "Successfully updated Discord message."
              exit 0
            fi
            echo "PATCH failed with status $RESPONSE. Falling back to a new post..."
          fi

          # 3. If no ID exists or PATCH failed, broadcast a fresh message
          echo "Sending fresh content to Discord..."
          NEW_MSG=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"content\": $JSON_CONTENT}" \
            "$WEBHOOK_URL?wait=true")
          
          # 4. Extract the newly assigned Message ID from Discord's response
          NEW_ID=$(echo "$NEW_MSG" | jq -r '.id')
          
          if [ "$NEW_ID" != "null" ] && [ -n "$NEW_ID" ]; then
            echo "New tracking ID registered: $NEW_ID"
            mkdir -p .github
            echo "$NEW_ID" > "$ID_FILE"
            
            # 5. Push the tracking file back to your repo without looping the CI
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@://github.com"
            git add "$ID_FILE"
            git commit -m "chore: save live discord message tracking id [skip ci]"
            git push
          else
            echo "Failed to capture a valid Message ID from Discord."
            echo "Discord Response: $NEW_MSG"
            exit 1
          fi
