name: Sync Features to Discord
on:
  push:
    branches:
      - main
    paths:
      - 'features.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Send Payload
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 1. Read the raw features.md file and convert it safely into a strict JSON object structure
          # Using jq directly on the file maps headers, linebreaks, and spaces perfectly.
          jq -Rs '{"content": .}' features.md > discord_payload.json

          # 2. Fire the native PATCH request using the stable JSON file structure
          curl -i -X PATCH \
            -H "Content-Type: application/json" \
            -d @discord_payload.json \
            "$WEBHOOK_URL/messages/1535224455218077707"
