name: Sync Features to Discord
on:
  push:
    branches:
      - main
    paths:
      - 'features.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read File Content
        id: read_file
        run: |
          CONTENT=$(cat features.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update Discord Message
        run: |
          # The slack layer tracks "message_id" dynamically. 
          # First run creates it. Future runs edit it.
          curl -i -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "text": '"$(echo "${{ steps.read_file.outputs.content }}" | jq -R -s '.')"',
              "message_id": "features_update_msg"
            }' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
