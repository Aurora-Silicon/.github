name: Sync Features to Discord
on:
  push:
    branches:
      - main
    paths:
      - 'features.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read File Content
        id: read_file
        run: |
          CONTENT=$(cat features.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update Discord Message
        run: |
          # Natively patch the webhook-owned message to overwrite it
          curl -i -X PATCH \
            -H "Content-Type: application/json" \
            -d '{"content": '"$(echo "${{ steps.read_file.outputs.content }}" | jq -R -s '.')"'}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}/messages/1535224455218077707"
